name: Cross-Platform CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run plain pytest
        run: pytest

      - name: Run deterministic reviewer path
        env:
          KIVI_MODEL_PROVIDER: deterministic
        run: |
          kivi db migrate
          kivi corpus validate corpus/kivi_500.jsonl
          kivi projects import corpus/projects.json
          kivi corpus import corpus/kivi_500.jsonl
          kivi evaluate --mode deterministic
