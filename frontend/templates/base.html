<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kivi</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <div class="wordmark-container">
      <div class="wordmark-icon">K</div>
      <div>
        <div class="wordmark-text type-headline-sm">Kivi</div>
        <div class="wordmark-sub type-body-sm">project-scoped memory</div>
      </div>
    </div>
    <nav class="app-nav">
      <a href="/" class="nav-link type-label-nav {% if request.url.path == '/' %}active{% endif %}">ask kivi</a>
      <a href="/briefing" class="nav-link type-label-nav {% if request.url.path == '/briefing' %}active{% endif %}">briefing</a>
      <a href="/inbox" class="nav-link type-label-nav {% if request.url.path == '/inbox' %}active{% endif %}">inbox</a>
      <a href="/timeline" class="nav-link type-label-nav {% if request.url.path == '/timeline' %}active{% endif %}">timeline</a>
      <a href="/import-eval" class="nav-link type-label-nav {% if request.url.path == '/import-eval' %}active{% endif %}">import and eval</a>
    </nav>
  </header>
  <main class="app-main">
    <aside class="contextual-sidebar">
      {% block sidebar %}{% endblock %}
    </aside>
    {% block content_wrapper %}
    <div class="content-stage reading">
      {% block content %}{% endblock %}
    </div>
    {% endblock %}
  </main>
</body>
</html>
