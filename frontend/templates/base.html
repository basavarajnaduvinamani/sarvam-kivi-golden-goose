<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivi - Semantic Memory</title>
    <!-- Vendored HTMX -->
    <script src="/static/vendor/htmx.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- Local CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">K</div>
            <h1 class="logo-text">Kivi</h1>
        </div>
        <div class="header-subtitle">Project-Scoped Memory</div>
        <nav class="header-nav" style="margin-left: auto; display: flex; gap: 1rem;">
            <a href="/">Ask</a>
            <a href="/briefing">Briefing</a>
            <a href="/inbox">Inbox</a>
            <a href="/timeline">Timeline</a>
            <a href="/import-eval">Import & Eval</a>
        </nav>
    </header>

    <main>
        <!-- Sidebar / Project Timeline -->
        <aside class="sidebar">
            {% block sidebar %}{% endblock %}
        </aside>

        <!-- Main Interaction Area -->
        <section class="main-interaction">
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
