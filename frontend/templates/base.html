<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kivi</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="kivi">
    <aside class="rail">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-name">Hey Kivi</div>
      </div>
      <div class="navgroup">
        <div class="navlabel">Workspace</div>
        <a href="/" class="navitem {% if request.url.path == '/' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
          Ask
        </a>
        <a href="/briefing" class="navitem {% if request.url.path == '/briefing' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"></path></svg>
          Briefing
        </a>
      </div>
      <div class="navgroup">
        <div class="navlabel">History</div>
        <a href="/timeline" class="navitem {% if request.url.path == '/timeline' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path></svg>
          Timeline
        </a>
        <a href="/inbox" class="navitem {% if request.url.path == '/inbox' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661Z"></path></svg>
          Inbox
        </a>
        <a href="/import-eval" class="navitem {% if request.url.path == '/import-eval' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"></path></svg>
          Import / Eval
        </a>
      </div>

    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-title">{% block top_title %}Overview{% endblock %}</div>
        <div class="avatar">K</div>
      </header>
      {% block content_wrapper %}
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      {% endblock %}
    </main>
  </div>
  {% block sidebar_wrapper %}
    {% block sidebar %}{% endblock %}
  {% endblock %}
</body>
</html>
