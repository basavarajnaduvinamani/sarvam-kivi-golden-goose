<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kivi - Semantic Memory</title>
    <!-- Vendored HTMX would go here, using CDN for dev -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Tailwind via CDN for rapid styling without Node build -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-green-600 rounded-md flex items-center justify-center text-white font-bold">K</div>
            <h1 class="text-xl font-semibold text-gray-800">Kivi</h1>
        </div>
        <div class="text-sm text-gray-500">Project-Scoped Memory</div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Sidebar / Project Timeline -->
        <aside class="md:col-span-1 space-y-6">
            {% block sidebar %}{% endblock %}
        </aside>

        <!-- Main Interaction Area -->
        <section class="md:col-span-2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-[600px]">
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
