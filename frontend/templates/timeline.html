{% extends "base.html" %}

{% block sidebar_wrapper %}{% endblock %}

{% block content %}
<h1 class="type-headline-md mb-lg">project timeline</h1>

<div class="mb-lg">
  <select id="project_id" class="w-full" style="max-width:300px;">
    <option value="" disabled selected>— choose a project —</option>
    {% for proj in projects %}
    <option value="{{ proj.id }}">{{ proj.name }}</option>
    {% endfor %}
  </select>
</div>

<div id="timeline-results">
  <div class="type-body-md color-dim text-center mt-lg">
    Select a project to view its memory timeline.
  </div>
</div>

<div id="evidence-drawer-container" class="mt-xl">
  {% include "components/evidence_drawer.html" %}
</div>

<script>
document.getElementById('project_id').addEventListener('change', function(e) {
    htmx.ajax('GET', '/htmx/timeline/' + e.target.value, '#timeline-results');
});
</script>
{% endblock %}
