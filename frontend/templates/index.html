{% extends "base.html" %}

{% block sidebar %}
<div class="panel">
    <h2 class="panel-title">Evidence Drawer</h2>
    <div id="evidence-drawer" class="evidence-drawer-content">
        Click on a citation in the answer to view the source evidence here.
    </div>
</div>
{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; height: 100%;">
    <!-- Chat Display Area -->
    <div class="chat-container" id="chat-history">
        <!-- Initial greeting -->
        <div class="chat-bubble bot">
            <p>Hello. I am Kivi. You can ask me questions about your projects.</p>
        </div>
        
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="htmx-indicator chat-bubble bot">
            <span>Retrieving evidence...</span>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <form hx-post="/htmx/ask" 
              hx-target="#chat-history" 
              hx-swap="beforeend" 
              hx-indicator="#loading-indicator"
              hx-on::after-request="if (event.detail.successful) document.getElementById('question-input').value = ''">
            
            <div class="form-row">
                <label for="project_id" class="form-label">Project Scope:</label>
                <select id="project_id" name="project_id" class="form-select">
                    <option value="">-- No specific project (Auto/Detect) --</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <input type="text" id="question-input" name="question" required
                       placeholder="Ask Hey Kivi..." 
                       class="form-input flex-grow">
                <button type="submit" class="btn">Ask</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
