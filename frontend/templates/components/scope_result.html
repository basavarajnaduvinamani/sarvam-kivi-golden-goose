{% if error %}
<div class="card border-failed">
  <div class="type-body-sm color-rose">{{ error }}</div>
</div>
{% else %}
<div class="card success">
  <div class="type-body-sm color-muted">Scoped to {{ result.take.project_id }}. Take {{ result.take.id }} is now being processed.</div>
</div>
{% endif %}
