{% extends "base.html" %}

{% block sidebar %}
<div id="evidence-drawer">
  {% include "components/evidence_drawer.html" %}
</div>
{% endblock %}

{% block content %}
<div class="intro">
  <h1>Project Briefing</h1>
  <p>Request a grounded briefing for a project.</p>
</div>

<div id="chat-history" class="conversation">
</div>

<form class="composer" hx-post="/htmx/briefing" hx-target="#chat-history" hx-swap="beforeend" hx-indicator="#briefing-loading" hx-on::after-request="if(event.detail.successful) this.elements.focus.value=''">
  <input type="text" name="focus" placeholder="e.g., provide the current project state and unresolved items.">
  <div class="composer-foot">
    <span>Scoped to
      <select id="project_id" name="project_id" required>
        <option value="" disabled selected>— choose a project —</option>
        {% for proj in projects %}
        <option value="{{ proj.id }}">{{ proj.name }}</option>
        {% endfor %}
      </select>
    </span>
    <button type="submit" class="primary" hx-disabled-elt="this">generate briefing</button>
  </div>
  <div id="briefing-loading" class="htmx-indicator warning" aria-live="polite">
    retrieving evidence...
  </div>
</form>
{% endblock %}
