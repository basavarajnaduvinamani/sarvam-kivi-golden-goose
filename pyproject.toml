[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kivi-golden-goose"
version = "0.1.0"
description = "Project-scoped semantic memory demonstration for Kivi"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "openai>=1.60,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pygments>=2.19,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
kivi = "kivi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/kivi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["backend"]
